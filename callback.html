<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verifikasi Email — Genius HR</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e3a8a 50%, #0c4a6e 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .box {
      background: rgba(255,255,255,.97);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%; max-width: 380px;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,.28);
    }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h2 { font-size: 1.2rem; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    p  { font-size: .88rem; color: #64748b; line-height: 1.6; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 20px; padding: 12px 24px;
      background: linear-gradient(180deg, #4f8ef7, #1d4ed8);
      color: #fff; border: none; border-radius: 10px;
      font-size: .9rem; font-weight: 800; cursor: pointer;
      font-family: inherit; text-decoration: none;
    }
  </style>
</head>
<body>
<div class="box" id="box">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">Memverifikasi akun...</h2>
  <p id="desc">Mohon tunggu sebentar</p>
</div>

<script type="module">
  import { supabase } from './js/supabase.js'

  async function handleCallback() {
    const spinner = document.getElementById('spinner')
    const title   = document.getElementById('title')
    const desc    = document.getElementById('desc')
    const box     = document.getElementById('box')

    try {
      // Ambil token dari URL hash
      const hash   = window.location.hash
      const params = new URLSearchParams(hash.substring(1))
      const token  = params.get('access_token')
      const refresh= params.get('refresh_token') || ''
      const type   = params.get('type') || 'signup'

      console.log('=== CALLBACK DEBUG ===')
      console.log('Token:', token ? 'YES' : 'NO')
      console.log('Type:', type)

      // Bersihkan URL
      history.replaceState(null, '', window.location.pathname)

      if (!token) {
        throw new Error('Token verifikasi tidak ditemukan')
      }

      // Set session dari token
      console.log('Setting session...')
      const { data, error: sessionError } = await supabase.auth.setSession({
        access_token: token,
        refresh_token: refresh
      })

      if (sessionError) {
        console.error('Session Error:', sessionError)
        throw sessionError
      }

      if (!data?.session?.user) {
        throw new Error('Session tidak valid')
      }

      const user = data.session.user
      console.log('Session berhasil, User ID:', user.id)
      console.log('User Email:', user.email)
      console.log('User email_confirmed_at:', user.email_confirmed_at)

      // Update profile status ke Aktif
      console.log('Updating profile status to Aktif...')
      const { error: updateErr, data: updateData } = await supabase
        .from('profiles')
        .update({ 
          status_akun: 'Aktif',
          updated_at: new Date().toISOString()
        })
        .eq('id', user.id)
        .select()

      if (updateErr) {
        console.error('Update Error:', updateErr)
        console.error('Update Error Message:', updateErr.message)
        // Lanjut saja, user sudah terverifikasi
      } else {
        console.log('Update Success:', updateData)
      }

      // Tampilkan sukses
      spinner.style.display = 'none'
      title.textContent = '✅ Email Terverifikasi!'
      desc.innerHTML = 'Akun kamu sudah siap. Anda akan diarahkan ke login...'

      console.log('✅ Verification complete, redirecting...')

      // Auto redirect ke login setelah 2 detik
      setTimeout(() => {
        window.location.replace('index.html')
      }, 2000)

    } catch (err) {
      console.error('=== CALLBACK ERROR ===')
      console.error('Error:', err)
      console.error('Message:', err.message)

      spinner.style.display = 'none'
      title.textContent = '❌ Ada Kendala'
      desc.innerHTML = `
        ${err.message || 'Verifikasi gagal'}<br><br>
        <small>Silakan coba login — akun Anda mungkin sudah aktif.</small>
      `
      box.innerHTML += `<a href="index.html" class="btn">← Ke Halaman Login</a>`
    }
  }

  // Jalankan
  handleCallback()
</script>
</body>
</html>
