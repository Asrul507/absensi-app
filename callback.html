<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verifikasi — Genius HR</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e3a8a 50%, #0c4a6e 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .box {
      background: rgba(255,255,255,.97);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%; max-width: 380px;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,.28);
    }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h2 { font-size: 1.2rem; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    p  { font-size: .88rem; color: #64748b; line-height: 1.6; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 20px; padding: 12px 24px;
      background: linear-gradient(180deg, #4f8ef7, #1d4ed8);
      color: #fff; border: none; border-radius: 10px;
      font-size: .9rem; font-weight: 800; cursor: pointer;
      font-family: inherit; text-decoration: none;
    }
  </style>
</head>
<body>
<div class="box" id="box">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">Memverifikasi akun...</h2>
  <p id="desc">Mohon tunggu sebentar</p>
</div>

<script type="module">
  import { supabase } from './js/supabase.js'

  async function handleCallback() {
    const hash   = window.location.hash
    const params = new URLSearchParams(hash.replace('#', ''))
    const type   = params.get('type')
    const token  = params.get('access_token')
    const refresh= params.get('refresh_token') || ''

    // Bersihkan URL
    history.replaceState(null, '', window.location.pathname)

    const spinner = document.getElementById('spinner')
    const title   = document.getElementById('title')
    const desc    = document.getElementById('desc')
    const box     = document.getElementById('box')

    if (!token) {
      // Tidak ada token → langsung redirect ke index
      window.location.href = 'index.html'
      return
    }

    try {
      const { data, error } = await supabase.auth.setSession({
        access_token:  token,
        refresh_token: refresh
      })

      if (error || !data?.session) throw error || new Error('Session tidak valid')

      const user = data.session.user

      // Update status akun di profiles jadi Aktif
      await supabase.from('profiles')
        .update({ status_akun: 'Aktif' })
        .eq('id', user.id)

      // Tampilkan sukses berdasarkan type
      spinner.style.display = 'none'

      if (type === 'email_change') {
        // Update email baru di profiles
        await supabase.from('profiles')
          .update({ email: user.email })
          .eq('id', user.id)

        title.textContent = '✅ Email Berhasil Diubah!'
        desc.textContent  = `Email kamu sekarang: ${user.email}`
      } else if (type === 'recovery') {
        title.textContent = '🔑 Reset Password'
        desc.textContent  = 'Silakan set password baru kamu.'
      } else {
        title.textContent = '✅ Akun Terverifikasi!'
        desc.textContent  = 'Selamat! Akun kamu sudah aktif. Klik tombol di bawah untuk mulai login.'
      }

      box.innerHTML += `<a href="index.html" class="btn">🚀 Masuk ke Aplikasi</a>`

      // Auto redirect setelah 2.5 detik
      setTimeout(() => { window.location.href = 'index.html' }, 2500)

    } catch (err) {
      console.error(err)
      spinner.style.display = 'none'
      title.textContent = '❌ Verifikasi Gagal'
      desc.innerHTML = `
        Link mungkin sudah kadaluarsa atau sudah pernah digunakan.<br><br>
        Coba login langsung — jika email sudah terverifikasi sebelumnya, akun kamu mungkin sudah aktif.
      `
      box.innerHTML += `<a href="index.html" class="btn">← Ke Halaman Login</a>`
    }
  }

  handleCallback()
</script>
</body>
</html>
