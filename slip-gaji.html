<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slip Gaji & History - Absensi App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Menggunakan style.css bawaan aplikasi Anda -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Penyesuaian agar selaras dengan tema gelap/terang style.css */
        .card-payroll {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 8px;
        }
        .slip-box {
            border: 2px dashed var(--primary-color, #3b82f6);
            padding: 30px;
            background-color: var(--bg-card, #ffffff);
            color: var(--text-color, #1e293b);
        }
        .table-payroll th {
            background-color: var(--table-header-bg, #f8fafc);
            color: var(--table-header-text, #64748b);
        }
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container my-5">
    <!-- FILTER SECTION (HISTORY) -->
    <div class="card card-payroll shadow-sm mb-4 no-print">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Riwayat & Slip Gaji</h5>
            <button class="btn btn-sm btn-outline-light" onclick="window.print()">Cetak Slip</button>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3" id="div-filter-kantor" style="display: none;">
                    <label class="form-label small font-monospace">Kantor/Domain</label>
                    <select id="filter-kantor" class="form-select form-select-sm"></select>
                </div>
                <div class="col-md-3" id="div-filter-karyawan" style="display: none;">
                    <label class="form-label small font-monospace">Pilih Karyawan</label>
                    <select id="filter-karyawan" class="form-select form-select-sm"></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small font-monospace">Periode Penggajian</label>
                    <select id="filter-periode" class="form-select form-select-sm">
                        <option value="">-- Pilih Periode --</option>
                    </select>
                </div>
                <div class="col-md-2 align-self-end">
                    <button id="btn-cari" class="btn btn-primary btn-sm w-100">Cari Data</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AREA SLIP GAJI (PRINT AREA) -->
    <div id="slip-container" class="print-area" style="display: none;">
        <div class="card card-payroll shadow-sm slip-box">
            <div class="row border-bottom pb-3 mb-4">
                <div class="col-6">
                    <h3 class="fw-bold text-primary mb-0" id="slip-nama-kantor">NAMA PERUSAHAAN</h3>
                    <small class="text-muted" id="slip-domain-kantor">domain-kantor.com</small>
                </div>
                <div class="col-6 text-end">
                    <h4 class="text-uppercase fw-semibold text-secondary">Slip Gaji Resmi</h4>
                    <span class="badge bg-success" id="slip-status">Approved</span>
                </div>
            </div>

            <div class="row mb-4 bg-light p-3 rounded mx-1">
                <div class="col-md-6">
                    <table class="table table-sm table-borderless mb-0">
                        <tr><td width="35%" class="text-muted">Nama</td><td>: <span id="slip-nama-karyawan" class="fw-bold">-</span></td></tr>
                        <tr><td class="text-muted">Departemen</td><td>: <span id="slip-dept-karyawan">-</span></td></tr>
                    </table>
                </div>
                <div class="col-md-6">
                    <table class="table table-sm table-borderless mb-0">
                        <tr><td width="35%" class="text-muted">Periode</td><td>: <span id="slip-periode" class="fw-bold">-</span></td></tr>
                        <tr><td class="text-muted">Tanggal Cetak</td><td>: <span id="slip-tanggal-cetak">-</span></td></tr>
                    </table>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <h6 class="border-bottom pb-2 fw-bold text-success">(+) Pemasukan (Earnings)</h6>
                    <table class="table table-sm table-borderless">
                        <tbody id="list-pemasukan"></tbody>
                    </table>
                </div>
                <div class="col-md-6">
                    <h6 class="border-bottom pb-2 fw-bold text-danger">(-) Potongan (Deductions)</h6>
                    <table class="table table-sm table-borderless">
                        <tbody id="list-potongan"></tbody>
                    </table>
                </div>
            </div>

            <div class="row border-top pt-3 align-items-center bg-dark text-white rounded p-2 mx-1">
                <div class="col-6">
                    <h5 class="mb-0 fw-bold">TOTAL GAJI BERSIH (Take Home Pay)</h5>
                </div>
                <div class="col-6 text-end">
                    <h3 class="mb-0 fw-bold text-warning" id="slip-total-bersih">Rp 0</h3>
                </div>
            </div>
        </div>
    </div>

    <div id="slip-empty" class="alert alert-warning text-center" style="display: block;">
        Silakan pilih filter di atas dan klik <strong>Cari Data</strong> untuk memuat slip gaji.
    </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/slip-view.js"></script>
</body>
</html>
