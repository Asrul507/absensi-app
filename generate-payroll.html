<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Payroll - Absensi App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
    <script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}</script>
    <style>
        /* ===== DARK MODE: Bootstrap overrides ===== */
        html.dark body { background: #0f1a2e !important; color: #e8f0fe; }
        html.dark .card { background: #1a2540 !important; border-color: rgba(255,255,255,.07) !important; color: #e8f0fe; }
        html.dark .card-header { background: #1e293b !important; border-color: rgba(255,255,255,.07) !important; color: #e8f0fe !important; }
        html.dark .card-body { background: transparent; color: #e8f0fe; }
        html.dark .form-control, html.dark .form-select {
            background: #131f35 !important;
            border-color: rgba(255,255,255,.1) !important;
            color: #e8f0fe !important;
        }
        html.dark .form-control option, html.dark .form-select option { background: #1a2540; color: #e8f0fe; }
        html.dark .form-label { color: #94a3b8; }
        html.dark .table { color: #e8f0fe !important; background: transparent; }
        html.dark .table td, html.dark .table th { border-color: rgba(255,255,255,.07) !important; color: #e8f0fe !important; }
        html.dark .table-striped>tbody>tr:nth-of-type(odd)>* { background-color: rgba(255,255,255,.04) !important; color: #e8f0fe; }
        html.dark .table-secondary, html.dark .table-secondary>th, html.dark .table-secondary>td { background-color: #1e293b !important; color: #7a90ac !important; }
        html.dark .table-secondary th { color: #7a90ac !important; }
        html.dark .table-hover>tbody>tr:hover>* { background-color: rgba(59,130,246,.1) !important; color: #e8f0fe !important; }
        html.dark .text-muted { color: #7a90ac !important; }
        html.dark .border-bottom { border-color: rgba(255,255,255,.07) !important; }
        html.dark .badge.bg-secondary { background: rgba(255,255,255,.15) !important; color: #94a3b8 !important; }
        html.dark .btn-outline-success { color: #4ade80 !important; border-color: rgba(74,222,128,.4) !important; }
        html.dark .btn-outline-success:hover { background: rgba(74,222,128,.15) !important; }
        html.dark .btn-outline-danger { color: #f87171 !important; border-color: rgba(248,113,113,.4) !important; }
        html.dark .btn-outline-danger:hover { background: rgba(248,113,113,.12) !important; }
        html.dark .payroll-summary { background: #1e293b !important; color: #e8f0fe !important; }
    </style>
</head>
<body>

<div class="container my-5 payroll-shell">
    <div class="card shadow-sm mb-4 payroll-card">
        <div class="card-header d-flex justify-content-between align-items-center payroll-card-header payroll-card-header--soft">
            <h5 class="mb-0"><i class="fas fa-calculator me-2"></i>4. Run & Generate Payroll</h5>
            <span id="role-indicator" class="badge bg-secondary">Role: Loading...</span>
        </div>
        <div class="card-body">
            <!-- Filter & Aksi Utama -->
            <div class="row g-3 align-items-center mb-3 payroll-action-row">
                <div class="col-md-3">
                    <label class="form-label small font-monospace">Pilih Periode Aktif/Lalu</label>
                    <select id="run-pilih-periode" class="form-select form-select-sm">
                        <option value="">-- Pilih Periode --</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small font-monospace">Filter Departemen</label>
                    <select id="run-filter-dept" class="form-select form-select-sm">
                        <option value="">-- Semua Departemen --</option>
                    </select>
                </div>
                <div class="col-md-3 align-self-end">
                    <button id="btn-proses-hitung" class="btn btn-primary btn-sm w-100 is-hidden">
                        <i class="fas fa-cogs me-1"></i> Ambil Template & Hitung Gaji
                    </button>
                </div>
                <div class="col-md-3 align-self-end text-end">
                    <button id="btn-approve-massal" class="btn btn-success btn-sm w-100 is-hidden">
                        <i class="fas fa-check-double me-1"></i> Approve Semua & Terbitkan Slip
                    </button>
                </div>
            </div>

            <!-- Tombol Ekspor Laporan (Excel & PDF) -->
            <div class="d-flex gap-2 justify-content-end mb-4 border-bottom pb-3">
                <button id="btn-export-excel" class="btn btn-outline-success btn-sm">
                    <i class="fas fa-file-excel me-1"></i> Unduh Excel
                </button>
                <button id="btn-export-pdf" class="btn btn-outline-danger btn-sm">
                    <i class="fas fa-file-pdf me-1"></i> Unduh PDF Laporan
                </button>
            </div>

            <!-- Tabel Hasil Pemrosesan -->
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle small payroll-table payroll-table--wide">
                    <thead class="table-secondary">
                        <tr>
                            <th>Karyawan</th>
                            <th>Total Pemasukan</th>
                            <th>Total Potongan</th>
                            <th>Gaji Bersih (THP)</th>
                            <th>Mode</th>
                            <th>Gaji Per Hari</th>
                            <th>Status Kelayakan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="payroll-run-table">
                        <tr>
                            <td colspan="8" class="text-center text-muted">Silakan tentukan periode di atas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Ringkasan Total THP -->
            <div id="payroll-total-summary" class="payroll-summary payroll-summary-box">
            </div>
        </div>
    </div>
</div>

<!-- ========================================================
     PEMANGGILAN LIBRARIES & SCRIPT DENGAN URUTAN YANG BENAR
     ======================================================== -->

<!-- 1. Pustaka untuk Ekspor Excel (SheetJS) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- 2. Pustaka untuk Ekspor PDF (jsPDF + AutoTable) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<!-- 3. Koneksi Inti Database Supabase -->
<script type="module" src="js/supabase.js"></script>

<!-- 4. Jembatan Data Absensi & Jadwal Bulanan -->
<script type="module" src="js/payroll-kalkulasi.js"></script> 

<!-- 5. Mesin Logic Hitung & Cetak Payroll Utama -->
<script type="module" src="js/payroll-run.js"></script>       
</body>
</html>
