<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="description" content="GenPro - Aplikasi Manajemen Absensi"/>
  <title>GenPro App</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="assets/css/genpro-clean-dashboard.css?v=20260622-2"/>
  <style>
    /* Override onClick behavior untuk gambar preview */
    .clickable-preview {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .clickable-preview:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body>

<div id="loginPage">
  <div class="login-box">

    <div class="login-logo">
      <span class="login-icon">🏢</span>
      <h1>GenPro</h1>
      <p>HR & Attendance Management System</p>
    </div>

    <form id="loginForm" onsubmit="login(); return false;">
      <div class="login-office-row">
        <div class="login-field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="staff01" autocomplete="username" autocapitalize="none"/>
        </div>

        <div class="login-field">
          <label for="clientCode">Office / Domain</label>
          <input type="text" id="clientCode" placeholder="kantora atau @kantora" autocomplete="organization"/>
          <small id="officeLookupHint" class="login-hint">Super admin boleh kosong.</small>
        </div>
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password"/>
      </div>

      <p id="loginError" style="display:none;color:var(--danger);font-size:.82rem;margin-top:8px; padding:10px 12px;background:var(--danger-light);border:1px solid var(--danger-mid); border-radius:var(--r-md);line-height:1.5;"></p>

      <button class="btn-login" id="btnLogin" type="submit">
        <i class="fa fa-sign-in-alt"></i> Masuk
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--gray-200);"><p style="font-size:.8rem;color:var(--text-muted);margin:0;">Akun dibuat oleh HRD/admin. Tidak ada self-register.</p></div>
  </div>
</div>

<div id="appPage" style="display:none;">

  <div class="topbar">
    <div class="topbar-left">
      <button class="btn-menu" onclick="toggleSidebar()" aria-label="Menu">
        <i class="fa fa-bars"></i>
      </button>
      <div class="topbar-title">GenPro</div>
      <button type="button" id="activeOfficeContext" class="topbar-office-context" onclick="window.changeActiveOfficeContext?.()" style="display:none;"></button>
    </div>
    <div class="topbar-right">
      <button type="button" id="userName" class="topbar-user-name" onclick="window.navigate('profile')" title="Profil saya"></button>
      <button class="btn-theme-toggle" onclick="toggleTheme()" aria-label="Ganti tema">
        <i class="fa fa-moon" id="themeIcon"></i>
      </button>
      <button class="btn-logout-top" onclick="logout()" aria-label="Keluar">
        <i class="fa fa-sign-out-alt"></i>
      </button>
    </div>
  </div>

  <div id="overlay" onclick="closeSidebar()"></div>

  <div id="sidebar"></div>

  <div id="content">
    <div style="display:flex;align-items:center;justify-content:center;height:60vh;">
      <div style="text-align:center;">
        <i class="fa fa-spinner fa-spin" style="font-size:2rem;color:var(--primary);"></i>
        <p style="margin-top:12px;color:var(--text-muted);font-size:.85rem;">Memuat...</p>
      </div>
    </div>
  </div>

  <div id="bottomNav"></div>

</div>

<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Memproses...</div>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
  // Guard sementara agar klik tombol login sebelum modul siap tidak melempar ReferenceError.
  window.login = window.login || function () {
    console.warn('App masih dimuat, coba lagi beberapa detik.')
  }
</script>
<script type="module" src="js/app.js?v=20260609-6"></script>

<script>
  document.addEventListener('click', function(e) {
    // Jika user meng-klik elemen gambar profil utama di dalam menu / halaman edit profil
    if (e.target && e.target.tagName === 'IMG' && (e.target.src.includes('supabase.co/storage/v1/object/public/avatars/') || e.target.id === 'editAvatarPreview')) {
      if (window.previewImageFullScreen) {
        window.previewImageFullScreen(e.target.src);
      }
    }
  });
</script>

</body>
</html>
