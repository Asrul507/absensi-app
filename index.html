<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Genius HR App</title>

  <!-- ICON -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginPage">

  <div class="login-box">

    <div class="login-logo">
      <div class="login-icon">🏢</div>
      <h1>GENIUS APP</h1>
      <p>HR & Attendance System</p>
    </div>

    <div class="login-field">
      <label>Email</label>
      <input type="email" id="email" placeholder="email@company.com"/>
    </div>

    <div class="login-field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Password"/>
    </div>

    <button class="btn-login" onclick="login()">
      <i class="fa-solid fa-right-to-bracket"></i> Login
    </button>

    <button id="btnSignup" class="btn-login" style="background:#059669;margin-top:10px;" onclick="signup()">
      Sign Up
    </button>

  </div>

</div>

<!-- ================= APP ================= -->
<div id="appPage" style="display:none;">

  <!-- TOPBAR -->
  <div class="topbar">

    <div class="topbar-left">
      <button class="btn-menu" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="topbar-title">GENIUS HR</div>
    </div>

    <div class="topbar-right">
      <span id="userName">User</span>
      <button class="btn-logout-top" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>

  </div>

  <!-- OVERLAY (WAJIB) -->
  <div id="sidebar"></div>
<div id="overlay" onclick="closeSidebar()"></div>

  <!-- CONTENT -->
  <div id="content">

    <div class="card">
      <h3>Dashboard</h3>
      <p>Selamat datang di HR System</p>
    </div>

  </div>

</div>

<!-- ================= SCRIPT ================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
