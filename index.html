<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Genius HR App</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginPage">
  <div class="login-box">

    <div class="login-logo">
      <span class="login-icon">🏢</span>
      <h1>GENIUS HR</h1>
      <p>HR & Attendance Management System</p>
    </div>

    <div class="login-field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="email@company.com" autocomplete="email"
        onkeydown="if(event.key==='Enter') document.getElementById('password').focus()"/>
    </div>

    <div class="login-field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') login()"/>
    </div>

    <!-- Error message -->
    <p id="loginError" style="display:none;color:var(--danger);font-size:.82rem;margin-top:6px;padding:10px 12px;background:var(--danger-light);border:1px solid var(--danger-mid);border-radius:var(--r-md);"></p>

    <button class="btn-login" id="btnLogin" onclick="login()">
      <i class="fa fa-sign-in-alt"></i> Masuk
    </button>

  </div>
</div>

<!-- ================= APP ================= -->
<div id="appPage" style="display:none;">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="btn-menu" onclick="toggleSidebar()" aria-label="Buka menu">
        <i class="fa fa-bars"></i>
      </button>
      <div class="topbar-title">GENIUS HR</div>
    </div>
    <div class="topbar-right">
      <span id="userName">User</span>
      <button class="btn-theme-toggle" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle tema">
        <i class="fa fa-moon" id="themeIcon"></i>
      </button>
      <button class="btn-logout-top" onclick="logout()" aria-label="Keluar">
        <i class="fa fa-sign-out-alt"></i>
      </button>
    </div>
  </div>

  <!-- OVERLAY -->
  <div id="overlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <div id="sidebar"></div>

  <!-- CONTENT -->
  <div id="content">
    <div class="card">
      <h3>Memuat Dashboard...</h3>
    </div>
  </div>

  <!-- BOTTOM NAV (mobile) -->
  <div id="bottomNav">
    <button class="bottom-nav-item active" onclick="navigate('dashboard')">
      <i class="fa fa-house"></i><span>Home</span>
    </button>
    <button class="bottom-nav-item" onclick="navigate('absensi')">
      <i class="fa fa-clock"></i><span>Absen</span>
    </button>
    <button class="bottom-nav-item" onclick="navigate('pengajuan')">
      <i class="fa fa-file-alt"></i><span>Ajukan</span>
    </button>
    <button class="bottom-nav-item" onclick="navigate('riwayat')">
      <i class="fa fa-list"></i><span>Riwayat</span>
    </button>
    <button class="bottom-nav-item" onclick="navigate('kalender')">
      <i class="fa fa-calendar"></i><span>Kalender</span>
    </button>
  </div>

</div>

<!-- LOADING OVERLAY -->
<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading...</div>
</div>

<!-- TOAST -->
<div id="toast-container"></div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
