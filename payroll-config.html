<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurasi Payroll - Absensi App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
    <script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}</script>
    <style>
        /* ===== DARK MODE: Bootstrap overrides ===== */
        html.dark body { background: #0f1a2e !important; color: #e8f0fe; }
        html.dark .card { background: #1a2540 !important; border-color: rgba(255,255,255,.07) !important; color: #e8f0fe; }
        html.dark .card-header { background: #1e293b !important; border-color: rgba(255,255,255,.07) !important; color: #e8f0fe !important; }
        html.dark .card-body { background: transparent; color: #e8f0fe; }
        html.dark .form-control, html.dark .form-select {
            background: #131f35 !important;
            border-color: rgba(255,255,255,.1) !important;
            color: #e8f0fe !important;
        }
        html.dark .form-control option, html.dark .form-select option { background: #1a2540; color: #e8f0fe; }
        html.dark .form-control::placeholder { color: #4a5f7a !important; }
        html.dark .form-label { color: #94a3b8; }
        html.dark .table { color: #e8f0fe !important; background: transparent; }
        html.dark .table td, html.dark .table th { border-color: rgba(255,255,255,.07) !important; color: #e8f0fe !important; }
        html.dark .table-striped>tbody>tr:nth-of-type(odd)>* { background-color: rgba(255,255,255,.04) !important; color: #e8f0fe; }
        html.dark .table-bordered td, html.dark .table-bordered th { border-color: rgba(255,255,255,.09) !important; }
        html.dark .table-light, html.dark .table-light>th, html.dark .table-light>td { background-color: #1e293b !important; color: #7a90ac !important; }
        html.dark .table-hover>tbody>tr:hover>* { background-color: rgba(59,130,246,.1) !important; color: #e8f0fe !important; }
        html.dark .text-muted { color: #7a90ac !important; }
        html.dark .text-primary { color: #60a5fa !important; }
        html.dark .border-end { border-color: rgba(255,255,255,.07) !important; }
        html.dark .list-group-item { background: #1a2540 !important; border-color: rgba(255,255,255,.07) !important; color: #e8f0fe !important; }
        html.dark .list-group-item:hover { background: rgba(59,130,246,.12) !important; }
        html.dark .list-group-item.active { background: rgba(59,130,246,.25) !important; border-color: rgba(59,130,246,.4) !important; color: #93c5fd !important; }
        html.dark .modal-content { background: #1a2540 !important; border-color: rgba(255,255,255,.07) !important; color: #e8f0fe; }
        html.dark .modal-header { background: #1e293b !important; border-color: rgba(255,255,255,.07) !important; color: #e8f0fe !important; }
        html.dark .modal-footer { border-color: rgba(255,255,255,.07) !important; background: #1a2540 !important; }
        html.dark .modal-body { background: #1a2540 !important; color: #e8f0fe; }
        html.dark .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
        html.dark h6 { color: #e8f0fe; }
    </style>
</head>
<body>

<div class="container my-5">
    
    <!-- Bagian 1: Master Komponen Gaji -->
    <div class="card shadow-sm mb-4">
        <div class="card-header" style="background:var(--primary);color:#fff;">
            <h5 class="mb-0">1. Master Komponen Gaji</h5>
        </div>
        <div class="card-body">
            <form id="form-komponen" class="row g-3">
                <div class="col-md-3">
                    <input type="text" id="kode-komponen" class="form-control" placeholder="Kode (mis: GAPOK)" required>
                </div>
                <div class="col-md-4">
                    <input type="text" id="nama-komponen" class="form-control" placeholder="Nama (mis: Gaji Pokok)" required>
                </div>
                <div class="col-md-3">
                    <select id="jenis-komponen" class="form-select" required>
                        <option value="pemasukan">Pemasukan (+)</option>
                        <option value="potongan">Potongan (-)</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Simpan</button>
                </div>
            </form>
            
            <table class="table table-sm mt-3 table-striped">
                <thead><tr><th>Kode</th><th>Nama Komponen</th><th>Jenis</th><th>Aksi</th></tr></thead>
                <tbody id="list-komponen-table"></tbody>
            </table>
        </div>
    </div>

    <!-- Bagian 2: Template Gaji -->
    <div class="card shadow-sm mb-4">
        <div class="card-header" style="background:var(--gray-100);color:var(--text);border-color:var(--border);">
            <h5 class="mb-0">2. Template Gaji & Nominal</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4 border-end">
                    <h6>Buat Template Baru</h6>
                    <form id="form-template">
                        <input type="text" id="nama-template" class="form-control mb-2" placeholder="Nama Template (mis: Staff IT)" required>
                        <button type="submit" class="btn btn-primary btn-sm w-100">Buat Template</button>
                    </form>
                    <ul class="list-group mt-3" id="list-template-grup">
                        <!-- JS Inject: Daftar Template -->
                    </ul>
                </div>
                
                <div class="col-md-8">
                    <h6>Isi Rincian Template: <span id="template-terpilih-nama" class="text-primary">-</span></h6>
                    <form id="form-detail-template" class="row g-2 mb-3" style="display: none;">
                        <input type="hidden" id="aktif-template-id">
                        <div class="col-md-5">
                            <select id="pilih-komponen" class="form-select" required></select>
                        </div>
                        <div class="col-md-3">
                            <select id="tipe-nilai-komponen" class="form-select" required>
                                <option value="nominal">Nominal (Rp)</option>
                                <option value="persen">Persen dari Gaji Pokok (%)</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="number" id="nominal-komponen" class="form-control" placeholder="Nominal Rp." step="0.01" min="0" required>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-success btn-sm w-100">+ Tambah</button>
                        </div>
                    </form>
                    
                    <table class="table table-sm table-bordered">
                        <thead class="table-light"><tr><th>Komponen</th><th>Jenis</th><th>Tipe Nilai</th><th>Nilai</th><th>Aksi</th></tr></thead>
                        <tbody id="list-detail-template">
                            <tr><td colspan="5" class="text-center text-muted">Pilih template terlebih dahulu</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bagian 3: Periode Gaji -->
    <div class="card shadow-sm mb-4">
        <div class="card-header" style="background:var(--primary);color:#fff;">
            <h5 class="mb-0">3. Pengaturan Periode Gaji</h5>
        </div>
        <div class="card-body">
            <form id="form-periode" class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="nama-periode" class="form-control" placeholder="Nama Periode (mis: Juli 2026)" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small mb-0">Mulai</label>
                    <input type="date" id="tgl-mulai" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small mb-0">Selesai</label>
                    <input type="date" id="tgl-selesai" class="form-control" required>
                </div>
                <div class="col-md-2 align-self-end">
                    <button type="submit" class="btn btn-primary w-100">Buka Periode</button>
                </div>
            </form>
            
            <table class="table table-sm mt-3 table-hover">
                <thead><tr><th>Nama Periode</th><th>Rentang Tanggal</th><th>Status</th><th>Aksi</th></tr></thead>
                <tbody id="list-periode-table"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Edit Komponen Gaji -->
<div class="modal fade" id="modalEditKomponen" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title fw-bold"><i class="fas fa-edit me-2"></i>Edit Komponen Gaji</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-komponen-id">
        <div class="mb-3">
          <label class="form-label small fw-bold">Kode Komponen</label>
          <input type="text" id="edit-kode-komponen" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Nama Komponen</label>
          <input type="text" id="edit-nama-komponen" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Jenis</label>
          <select id="edit-jenis-komponen" class="form-select">
            <option value="pemasukan">Pemasukan (+)</option>
            <option value="potongan">Potongan (-)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="simpanEditKomponen()">
          <i class="fas fa-save me-1"></i>Simpan Perubahan
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Edit Template Gaji -->
<div class="modal fade" id="modalEditTemplate" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold"><i class="fas fa-edit me-2"></i>Edit Template Gaji</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-template-id">
        <div class="mb-3">
          <label class="form-label small fw-bold">Nama Template</label>
          <input type="text" id="edit-nama-template" class="form-control" placeholder="Nama Template">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="simpanEditTemplate()">
          <i class="fas fa-save me-1"></i>Simpan Perubahan
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle (for Modal) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- BENAR -->
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/payroll-config.js"></script>
</body>
</html>
