<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Template Payroll - Absensi App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PUSTAKA IKON FONT AWESOME UNTUK AKSI HAPUS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}</script>
    <style>
        .card-payroll {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .table-payroll th {
            background-color: var(--gray-50);
            color: var(--text-muted);
        }
        /* ===== DARK MODE: Bootstrap overrides ===== */
        html.dark body { background: #0f1a2e !important; color: #e8f0fe; }
        html.dark .card, html.dark .card-payroll { background: #1a2540 !important; border-color: rgba(255,255,255,.07) !important; color: #e8f0fe; }
        html.dark .card-header { background: #1e293b !important; border-color: rgba(255,255,255,.07) !important; color: #e8f0fe !important; }
        html.dark .card-body { background: transparent; color: #e8f0fe; }
        html.dark .form-control, html.dark .form-select {
            background: #131f35 !important;
            border-color: rgba(255,255,255,.1) !important;
            color: #e8f0fe !important;
        }
        html.dark .form-control option, html.dark .form-select option { background: #1a2540; color: #e8f0fe; }
        html.dark .form-control::placeholder { color: #4a5f7a !important; }
        html.dark .form-label { color: #94a3b8; }
        html.dark .table, html.dark .table-payroll { color: #e8f0fe !important; background: transparent; }
        html.dark .table td, html.dark .table th { border-color: rgba(255,255,255,.07) !important; color: #e8f0fe !important; }
        html.dark .table-striped>tbody>tr:nth-of-type(odd)>* { background-color: rgba(255,255,255,.04) !important; color: #e8f0fe; }
        html.dark .table-hover>tbody>tr:hover>* { background-color: rgba(59,130,246,.1) !important; color: #e8f0fe !important; }
        html.dark .text-muted { color: #7a90ac !important; }
        html.dark .border-bottom { border-color: rgba(255,255,255,.07) !important; }
        html.dark h6 { color: #e8f0fe; }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="card card-payroll shadow-sm">
        <div class="card-header" style="background:var(--primary);color:#fff;">
            <h5 class="mb-0"><i class="fas fa-link me-2"></i>Input Template Payroll</h5>
        </div>
        <div class="card-body">
            <!-- PENGEMBANGAN FORM: Menambahkan Field Bank & No Rekening -->
            <form id="form-mapping" class="row g-3 border-bottom pb-4 mb-4">
                <div class="col-md-3">
                    <label class="form-label small font-monospace fw-bold">1. Pilih Karyawan</label>
                    <select id="pilih-karyawan" class="form-select form-select-sm" required>
                        <option value="">-- Pilih Karyawan --</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small font-monospace fw-bold">2. Tentukan Template Gaji</label>
                    <select id="pilih-template" class="form-select form-select-sm" required>
                        <option value="">-- Pilih Template Gaji --</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small font-monospace fw-bold">3. Nama Bank</label>
                    <input type="text" id="nama-bank" class="form-control form-control-sm" placeholder="Contoh: BCA, Mandiri" required>
                </div>
                <div class="col-md-1">
                    <label class="form-label small font-monospace fw-bold">4. No. Rekening</label>
                    <input type="text" id="nomor-rekening" class="form-control form-control-sm" placeholder="Nomor rekening" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label small font-monospace fw-bold">5. Mode Gaji</label>
                    <select id="salary-mode" class="form-select form-select-sm" required>
                        <option value="bulanan">Bulanan</option>
                        <option value="harian">Harian</option>
                    </select>
                </div>
                <div class="col-md-2" id="hari-kerja-wrapper" style="display: none;">
                    <label class="form-label small font-monospace fw-bold">Hari Kerja/Bulan</label>
                    <input type="number" id="hari-kerja-per-bulan" class="form-control form-control-sm" min="20" max="31" value="26">
                </div>
                <div class="col-md-2 align-self-end">
                    <button type="submit" class="btn btn-success btn-sm w-100"><i class="fas fa-save me-1"></i> Simpan</button>
                </div>
            </form>

            <h6>Daftar Status Gaji Karyawan Saat Ini</h6>
            <div class="table-responsive">
                <table class="table table-sm table-striped align-middle table-payroll">
                    <thead>
                        <tr>
                            <th>Nama Karyawan</th>
                            <th>Template Gaji yang Digunakan</th>
                            <!-- PENGEMBANGAN TABEL: Kolom Tambahan Informasi Bank -->
                            <th>Informasi Bank / Rekening</th>
                            <th>Mode Gaji</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="list-mapping-table">
                        <tr>
                            <td colspan="5" class="text-center text-muted">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- PEMANGGILAN SCRIPT YANG BENAR -->
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/payroll-mapping.js"></script>
</body>
</html>
