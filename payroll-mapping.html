<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemetaan Gaji Karyawan - Absensi App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PUSTAKA IKON FONT AWESOME UNTUK AKSI HAPUS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .card-payroll {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 8px;
        }
        .table-payroll th {
            background-color: var(--table-header-bg, #f8fafc);
            color: var(--table-header-text, #64748b);
        }
    </style>
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card card-payroll shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-link me-2"></i>Hubungkan Karyawan ke Template Gaji</h5>
        </div>
        <div class="card-body">
            <!-- PENGEMBANGAN FORM: Menambahkan Field Bank & No Rekening -->
            <form id="form-mapping" class="row g-3 border-bottom pb-4 mb-4">
                <div class="col-md-3">
                    <label class="form-label small font-monospace fw-bold">1. Pilih Karyawan</label>
                    <select id="pilih-karyawan" class="form-select form-select-sm" required>
                        <option value="">-- Pilih Karyawan --</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small font-monospace fw-bold">2. Tentukan Template Gaji</label>
                    <select id="pilih-template" class="form-select form-select-sm" required>
                        <option value="">-- Pilih Template Gaji --</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small font-monospace fw-bold">3. Nama Bank</label>
                    <input type="text" id="nama-bank" class="form-control form-control-sm" placeholder="Contoh: BCA, Mandiri" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label small font-monospace fw-bold">4. No. Rekening</label>
                    <input type="text" id="nomor-rekening" class="form-control form-control-sm" placeholder="Nomor rekening" required>
                </div>
                <div class="col-md-2 align-self-end">
                    <button type="submit" class="btn btn-success btn-sm w-100"><i class="fas fa-save me-1"></i> Simpan</button>
                </div>
            </form>

            <h6>Daftar Status Gaji Karyawan Saat Ini</h6>
            <div class="table-responsive">
                <table class="table table-sm table-striped align-middle table-payroll">
                    <thead>
                        <tr>
                            <th>Nama Karyawan</th>
                            <th>Template Gaji yang Digunakan</th>
                            <!-- PENGEMBANGAN TABEL: Kolom Tambahan Informasi Bank -->
                            <th>Informasi Bank / Rekening</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="list-mapping-table">
                        <tr>
                            <td colspan="4" class="text-center text-muted">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- PEMANGGILAN SCRIPT YANG BENAR -->
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/payroll-mapping.js"></script>
</body>
</html>
