<div id="view-pos" class="flex-1 flex overflow-hidden">
  <!-- KATALOG PRODUK -->
  <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">
    <div class="p-3 bg-white border-b border-slate-200 flex gap-2 shrink-0 items-center">
      <div class="relative flex-1">
        <input 
          id="search-input"
          type="text" 
          placeholder="Ketik nama atau scan barcode barang..." 
          class="w-full pl-9 pr-3 py-2 text-sm bg-slate-100 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
        />
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
      </div>
    </div>

    <div id="category-container" class="flex gap-2 p-3 overflow-x-auto bg-white border-b border-slate-200 shrink-0 no-scrollbar">
      <button onclick="window.filterCategory('ALL')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white shrink-0 shadow-sm" data-category="ALL">Semua</button>
    </div>

    <div class="flex-1 p-3 overflow-y-auto pb-44 md:pb-3">
      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5">
        <div class="col-span-full py-12 text-center text-slate-400 text-sm">Memuat katalog barang...</div>
      </div>
    </div>
  </main>

  <!-- KERANJANG KASIR DESKTOP -->
  <aside class="hidden md:flex md:w-80 lg:w-96 bg-white border-l border-slate-200 flex-col justify-between shrink-0 shadow-sm">
    <div class="p-3.5 border-b border-slate-200 flex items-center justify-between">
      <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
        <i class="fa-solid fa-basket-shopping text-emerald-600"></i>
        <span>Keranjang Belanja</span>
      </h2>
      <button onclick="window.clearCart()" class="text-xs text-rose-500 hover:text-rose-700 font-semibold flex items-center gap-1">
        <i class="fa-solid fa-trash-can"></i>
        <span>Kosongkan</span>
      </button>
    </div>

    <div id="cart-list" class="flex-1 p-3 overflow-y-auto space-y-2">
      <div class="text-center py-12 text-slate-400 text-xs">Keranjang masih kosong</div>
    </div>

    <div class="p-4 border-t border-slate-200 bg-slate-50 space-y-3">
      <div class="flex justify-between items-center text-xs text-slate-600">
        <span>Jumlah Item</span>
        <span id="cart-total-qty" class="font-bold text-slate-800">0</span>
      </div>
      <div class="flex justify-between items-center font-bold text-base text-slate-900 border-t border-slate-200 pt-2">
        <span>Total Tagihan</span>
        <span id="cart-total-price" class="text-emerald-600 font-extrabold text-lg">Rp 0</span>
      </div>
      <button 
        id="btn-checkout" 
        onclick="window.openCheckoutModal()" 
        disabled
        class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-sm text-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-money-bill-wave"></i>
        <span>Bayar Sekarang</span>
      </button>
    </div>
  </aside>
</div>
